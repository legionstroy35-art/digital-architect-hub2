<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(0 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="6" y2="3" stroke="#1E293B" stroke-width="1.2" />
    </pattern>
    <pattern id="diagHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="8" y2="4" stroke="#1E293B" stroke-width="1.4" />
    </pattern>
    <filter id="engraveShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background container optional (transparent) -->
  <rect width="400" height="400" fill="none" rx="40" />

  <!-- Monogram Group (M, P, S intertwined engraving) -->
  <g filter="url(#engraveShadow)" transform="translate(20, 15) scale(0.9)">
    
    <!-- Outer Flourish Curves (Letter S background ribbons) -->
    <!-- Top-left loop -->
    <path d="M 105,75 C 60,70 35,110 40,165 C 45,215 80,240 120,250 C 70,270 45,315 65,360 C 85,400 145,405 180,380 C 205,360 215,335 205,315 C 195,295 165,305 145,325 C 125,345 95,335 90,305 C 85,270 120,240 160,225 C 190,215 210,195 200,165 C 190,135 155,145 135,160 C 115,175 90,165 85,135 C 80,105 105,90 130,85 Z" 
          fill="#0F172A" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />
    <path d="M 102,80 C 65,75 45,115 48,160 C 52,205 85,230 122,242 C 75,265 52,308 70,350 C 88,385 140,395 172,372 C 195,355 202,332 195,318 C 188,302 165,310 148,325 C 130,340 102,332 98,308 C 92,275 125,248 162,232" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Right Intertwined Loop of S / Flourish -->
    <path d="M 260,85 C 315,95 345,135 340,185 C 335,235 295,265 250,275 C 300,295 330,335 315,380 C 300,420 240,420 200,395 C 170,375 165,345 180,330 C 195,315 220,325 235,345 C 250,365 280,360 288,335 C 295,300 260,275 220,265" 
          fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 260,85 C 315,95 345,135 340,185 C 335,235 295,265 250,275 C 300,295 330,335 315,380 C 300,420 240,420 200,395 C 170,375 165,345 180,330 C 195,315 220,325 235,345 C 250,365 280,360 288,335 C 295,300 260,275 220,265" 
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

    <!-- Ornate Letter M -->
    <!-- Left Main Diagonal & Stem of M -->
    <path d="M 80,320 L 80,335 C 95,335 110,325 115,300 L 140,120 C 145,95 130,85 115,85 L 100,85 L 100,70 L 165,70 L 165,85 C 150,85 140,95 138,115 L 118,255 L 185,135 C 192,120 195,115 195,100 C 195,85 185,85 175,85 L 175,70 L 235,70 L 235,85 C 220,85 210,95 205,115 L 180,260 L 205,305 C 215,325 225,335 240,335 L 240,350 L 175,350 L 175,335 C 190,335 195,325 190,310 L 170,275 L 135,335 C 128,348 118,350 100,350 L 70,350 L 70,335 C 75,335 78,330 80,320 Z" 
          fill="#0F172A" stroke="#0F172A" stroke-width="2" />
    
    <!-- Letter M Inner Engraving Hatching & Highlights -->
    <path d="M 125,120 L 110,240 L 118,245 L 132,125 Z" fill="#FFFFFF" />
    <path d="M 128,125 L 113,235" stroke="#0F172A" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Center V of M -->
    <polygon points="142,105 185,190 228,105 210,105 185,160 160,105" fill="#0F172A" />
    <line x1="185" y1="105" x2="185" y2="165" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 3" />

    <!-- Ornate Letter P (Foreground Right) -->
    <!-- P Vertical Stem -->
    <path d="M 225,140 L 255,140 C 265,140 270,135 270,120 L 270,105 L 290,105 L 290,335 C 290,355 280,365 260,365 L 245,365 L 245,380 L 325,380 L 325,365 L 310,365 C 295,365 290,350 290,335 L 290,265 C 315,265 350,260 365,225 C 378,195 370,150 340,125 C 320,110 295,105 270,105 L 225,105 Z" 
          fill="#0F172A" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />

    <!-- P Stem Engraved Shading Lines (Woodcut style) -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
      <line x1="272" y1="120" x2="288" y2="120" />
      <line x1="272" y1="130" x2="288" y2="130" />
      <line x1="272" y1="140" x2="288" y2="140" />
      <line x1="272" y1="150" x2="288" y2="150" />
      <line x1="272" y1="160" x2="288" y2="160" />
      <line x1="272" y1="170" x2="288" y2="170" />
      <line x1="272" y1="180" x2="288" y2="180" />
      <line x1="272" y1="190" x2="288" y2="190" />
      <line x1="272" y1="200" x2="288" y2="200" />
      <line x1="272" y1="210" x2="288" y2="210" />
      <line x1="272" y1="220" x2="288" y2="220" />
      <line x1="272" y1="230" x2="288" y2="230" />
      <line x1="272" y1="240" x2="288" y2="240" />
      <line x1="272" y1="250" x2="288" y2="250" />
      <line x1="272" y1="260" x2="288" y2="260" />
      <line x1="272" y1="270" x2="288" y2="270" />
      <line x1="272" y1="280" x2="288" y2="280" />
      <line x1="272" y1="290" x2="288" y2="290" />
      <line x1="272" y1="300" x2="288" y2="300" />
      <line x1="272" y1="310" x2="288" y2="310" />
      <line x1="272" y1="320" x2="288" y2="320" />
      <line x1="272" y1="330" x2="288" y2="330" />
      <line x1="272" y1="340" x2="288" y2="340" />
      <line x1="272" y1="350" x2="288" y2="350" />
    </g>

    <!-- P Loop Hollow (Counter) -->
    <path d="M 292,130 C 315,130 342,145 342,185 C 342,225 315,242 292,242 Z" 
          fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
    <!-- Inner P hatching -->
    <path d="M 294,140 C 310,140 330,152 330,185 C 330,218 310,232 294,232 Z" 
          fill="none" stroke="#0F172A" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Front Curved S / Monogram Ribbon sweeping across P and M -->
    <path d="M 140,240 C 155,210 185,185 220,185 C 245,185 255,200 248,220 C 240,240 220,260 195,285 C 165,315 145,355 170,385 C 190,410 235,405 255,370 C 265,350 262,335 250,335 C 240,335 235,345 230,355 C 220,375 195,375 185,360 C 175,340 185,310 215,275 C 245,240 270,215 272,185 C 275,150 245,140 215,145 C 175,150 142,185 125,225 Z" 
          fill="#0F172A" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Central Swirl & Acanthus Leaf Flourishes -->
    <path d="M 195,200 C 205,180 225,180 230,195 C 235,210 215,230 195,250" 
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Chiseled Edge Highlights -->
    <path d="M 145,85 L 165,85 L 140,250 L 125,250 Z" fill="#FFFFFF" opacity="0.2" />
    <path d="M 320,380 L 325,380 L 320,365 L 310,365 Z" fill="#FFFFFF" opacity="0.3" />
  </g>
</svg>